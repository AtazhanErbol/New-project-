# Nginx для Beauty by Kabylova (beauty.devbench.shop)
# Скопировать в /etc/nginx/sites-available/beauty.devbench.shop и включить симлинком.
# После этого запустить certbot --nginx — он сам допишет блок для HTTPS (443).

server {
    listen 80;
    server_name beauty.devbench.shop;

    # Разрешаем загрузку фото до 20 МБ (админка загружает изображения)
    client_max_body_size 20M;

    # Статика Django (собирается командой collectstatic)
    location /static/ {
        alias /root/New-project-/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Загруженные через админку файлы (фото мастеров, услуг, логотип)
    location /media/ {
        alias /root/New-project-/media/;
        access_log off;
        expires 30d;
    }

    # Всё остальное — в приложение (gunicorn слушает 127.0.0.1:8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
